name: flutter_ai_whisper
description: >-
  MCP server that inspects and injects state in a running Flutter app over the
  Dart VM Service, supporting route navigation and Riverpod, Bloc and GetX.
version: 1.1.0

repository: https://github.com/RajKavadia/flutter_ai_whisper
issue_tracker: https://github.com/RajKavadia/flutter_ai_whisper/issues
homepage: https://github.com/RajKavadia/flutter_ai_whisper

topics:
  - mcp
  - flutter
  - developer-tools
  - vm-service
  - debugging

# Enables `dart pub global activate flutter_ai_whisper`.
executables:
  flutter_ai_whisper: main

environment:
  # mcp_server 2.x needs Dart 3.7+ at runtime; lints 6 needs 3.8 as a dev
  # dependency. Taking the higher of the two keeps `dart pub get` satisfiable.
  sdk: ^3.8.0

dependencies:
  args: ^2.5.0
  dtd: ^4.0.0
  mcp_server: ^2.2.4
  meta: ^1.15.0
  vm_service: ^15.3.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0