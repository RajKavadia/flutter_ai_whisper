include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # Treat missing docs on public API as a build failure.
    public_member_api_docs: warning

linter:
  rules:
    - avoid_empty_else
    - avoid_relative_lib_imports
    - directives_ordering
    - prefer_final_locals
    - unawaited_futures
    - unnecessary_await_in_return